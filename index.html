<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Ulang Kaji Bahasa Arab Tingkatan 2</title>
<style>
:root{--blue:#174a7e;--light:#eef5fb;--green:#18794e;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f9;color:#17212b;line-height:1.5}
header{background:var(--blue);color:white;padding:24px 16px;text-align:center}header h1{margin:0 0 8px;font-size:clamp(1.3rem,4vw,2rem)}
main{max-width:900px;margin:20px auto;padding:0 14px}.tools{position:sticky;top:0;background:#fff;padding:12px;border:1px solid #d8e0e8;border-radius:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:2}
button{border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e5edf5;color:#17324d}
#result{font-weight:bold}.section{margin:24px 0 10px;color:var(--blue);border-bottom:2px solid #c8d9e8;padding-bottom:6px}
.question{background:white;border:1px solid #dce3ea;border-radius:10px;padding:16px;margin:12px 0;box-shadow:0 1px 2px #00000008}
.qtext{font-weight:600;margin-bottom:12px}.arabic{font-size:1.35rem;direction:rtl;unicode-bidi:plaintext;display:inline-block}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.option{display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid #d9e1e8;border-radius:8px;cursor:pointer}
.option:has(input:checked){background:#eaf3fc;border-color:#5792c5}
.option input{margin-top:5px;accent-color:var(--blue)}.correct{background:#e7f6ed!important;border-color:#55a879!important}.wrong{background:#fff0ef!important;border-color:#df7770!important}
.feedback{font-size:.92rem;font-weight:bold;margin-top:9px}.passage{background:#fff;border-radius:10px;padding:16px;margin:12px 0}.passage p{margin:8px 0}
footer{text-align:center;color:#64748b;padding:24px;font-size:.9rem}
@media print{body{background:white}header{background:white;color:black;padding:10px}.tools{position:static}.question{break-inside:avoid;box-shadow:none}.option{padding:5px}button{display:none}}
</style>
</head>
<body>
<header><h1>Latihan Ulang Kaji Bahasa Arab Tingkatan 2</h1><div>50 Soalan Objektif • 50 Markah</div></header>
<main>
<div class="tools"><span id="progress">0 / 50 dijawab</span><span id="result">Pilih jawapan bagi setiap soalan.</span><div><button class="primary" onclick="gradeQuiz()">Semak Jawapan</button> <button class="secondary" onclick="resetQuiz()">Cuba Semula</button></div></div>
<div id="quiz"></div>
</main><footer>Latihan ulang kaji Bahasa Arab Tingkatan 2</footer>
<script>
const questions=[{"n": 1, "q": "Apakah maksud perkataan الْمِظَلَّةُ?", "opts": ["Kasut", "Payung", "Beg", "Baju"], "a": 1}, {"n": 2, "q": "Apakah maksud perkataan الْمِرْوَحَةُ?", "opts": ["Kipas", "Lampu", "Jam", "Televisyen"], "a": 0}, {"n": 3, "q": "Apakah maksud perkataan الْمَطْعَمُ?", "opts": ["Kedai buku", "Restoran", "Hospital", "Pasar"], "a": 1}, {"n": 4, "q": "Apakah maksud perkataan الْمَزْرَعَةُ?", "opts": ["Kebun / ladang", "Sekolah", "Masjid", "Pejabat"], "a": 0}, {"n": 5, "q": "Apakah maksud perkataan الْجَسْرُ?", "opts": ["Jalan", "Jambatan", "Sungai", "Gunung"], "a": 1}, {"n": 6, "q": "Apakah maksud perkataan الرِّيَاضَةُ?", "opts": ["Kesihatan", "Sukan", "Pelajaran", "Kebersihan"], "a": 1}, {"n": 7, "q": "Apakah maksud perkataan الْمُسَافِرُ?", "opts": ["Pelancong / pengembara", "Peniaga", "Petani", "Guru"], "a": 0}, {"n": 8, "q": "Apakah maksud perkataan الْمَطَارُ?", "opts": ["Pelabuhan", "Lapangan terbang", "Stesen bas", "Stesen kereta api"], "a": 1}, {"n": 9, "q": "Apakah maksud perkataan الْمَكْتَبُ?", "opts": ["Meja / pejabat", "Kerusi", "Buku", "Pensel"], "a": 0}, {"n": 10, "q": "Apakah maksud perkataan الْفَاكِهَةُ?", "opts": ["Sayur-sayuran", "Buah-buahan", "Daging", "Ikan"], "a": 1}, {"n": 11, "q": "Apakah maksud perkataan الْمُسْلِمُ?", "opts": ["Orang Islam lelaki", "Orang bukan Islam", "Guru perempuan", "Pelajar perempuan"], "a": 0}, {"n": 12, "q": "Apakah maksud perkataan الْبَحْرُ?", "opts": ["Tasik", "Laut", "Sungai", "Air terjun"], "a": 1}, {"n": 13, "q": "Apakah maksud perkataan يَسْتَيْقِظُ?", "opts": ["Tidur", "Bangun daripada tidur", "Makan", "Mandi"], "a": 1}, {"n": 14, "q": "Apakah maksud perkataan يَسْمَعُ?", "opts": ["Melihat", "Membaca", "Mendengar", "Bercakap"], "a": 2}, {"n": 15, "q": "Apakah maksud perkataan الْجَمِيلُ?", "opts": ["Cantik", "Buruk", "Jauh", "Dekat"], "a": 0}, {"n": 16, "q": "Pilih kata ganti nama yang bermaksud \"Kamu perempuan\".", "opts": ["أَنْتَ", "أَنْتِ", "هِيَ", "هُوَ"], "a": 1}, {"n": 17, "q": "Apakah maksud نَحْنُ?", "opts": ["Saya", "Kamu", "Kami / kita", "Mereka"], "a": 2}, {"n": 18, "q": "Pilih kata ganti nama yang bermaksud \"Mereka berdua lelaki\".", "opts": ["هُمَا", "هُمْ", "هُنَّ", "أَنْتُمْ"], "a": 0}, {"n": 19, "q": "Pilih perkataan yang merupakan fi‘il māḍī.", "opts": ["يَفْتَحُ", "اِفْتَحْ", "فَتَحَ", "فَاتِحٌ"], "a": 2}, {"n": 20, "q": "Pilih perkataan yang merupakan fi‘il muḍāri‘.", "opts": ["نَصَرَ", "يَنْصُرُ", "اُنْصُرْ", "نَصْرٌ"], "a": 1}, {"n": 21, "q": "Pilih fi‘il amr yang bermaksud \"Duduklah!\"", "opts": ["جَلَسَ", "يَجْلِسُ", "اِجْلِسْ", "جَالِسٌ"], "a": 2}, {"n": 22, "q": "Apakah bentuk mufrad bagi الْمُعَلِّمُونَ?", "opts": ["مُعَلِّمٌ", "مُعَلِّمَانِ", "مُعَلِّمَةٌ", "مُعَلِّمَاتٌ"], "a": 0}, {"n": 23, "q": "Apakah bentuk muthanna bagi كِتَابٌ?", "opts": ["كُتُبٌ", "كِتَابَانِ", "كَاتِبٌ", "مَكْتَبٌ"], "a": 1}, {"n": 24, "q": "Pilih isim isyarah yang bermaksud \"Ini (perempuan)\".", "opts": ["هَذَا", "ذَلِكَ", "هَذِهِ", "تِلْكَ"], "a": 2}, {"n": 25, "q": "Pilih perkataan yang bermaksud \"Itu (lelaki)\".", "opts": ["هَذَا", "هَذِهِ", "ذَلِكَ", "تِلْكَ"], "a": 2}, {"n": 26, "q": "Pilih kata nama yang menunjukkan bilangan dua.", "opts": ["قَلَمٌ", "قَلَمَانِ", "أَقْلَامٌ", "كِتَابٌ"], "a": 1}, {"n": 27, "q": "Manakah antara berikut merupakan isim muannath?", "opts": ["مُهَنْدِسٌ", "طَبِيبٌ", "طَبِيبَةٌ", "وَلَدٌ"], "a": 2}, {"n": 28, "q": "Apakah maksud perkataan تَحْتَ?", "opts": ["Di atas", "Di bawah", "Di hadapan", "Di belakang"], "a": 1}, {"n": 29, "q": "Apakah maksud perkataan أَمَامَ?", "opts": ["Di hadapan", "Di belakang", "Di dalam", "Di luar"], "a": 0}, {"n": 30, "q": "Pilih perkataan yang merupakan kata sifat (نَعْتٌ).", "opts": ["كَبِيرٌ", "يَكْتُبُ", "ذَهَبَ", "اِجْلِسْ"], "a": 0}, {"n": 31, "q": "فَاطِمَةُ ______ إِلَى السُّوقِ.", "opts": ["يَذْهَبُ", "تَذْهَبُ", "أَذْهَبُ", "نَذْهَبُ"], "a": 1}, {"n": 32, "q": "أَنَا ______ فِي الْبَيْتِ.", "opts": ["أَدْرُسُ", "يَدْرُسُ", "تَدْرُسُ", "يَدْرُسُونَ"], "a": 0}, {"n": 33, "q": "هُمَا ______ اللُّغَةَ الْعَرَبِيَّةَ.", "opts": ["يَتَعَلَّمَانِ", "تَتَعَلَّمُ", "يَتَعَلَّمُونَ", "أَتَعَلَّمُ"], "a": 0}, {"n": 34, "q": "الْأُمُّ ______ الطَّعَامَ.", "opts": ["يَطْبُخُ", "تَطْبُخُ", "أَطْبُخُ", "نَطْبُخُ"], "a": 1}, {"n": 35, "q": "يَا طَالِبَةُ، ______ الدَّرْسَ!", "opts": ["اِقْرَأْ", "اِقْرَئِي", "يَقْرَأُ", "قَرَأَ"], "a": 1}, {"n": 36, "q": "الْفَلَّاحُ ______ الْأَشْجَارَ.", "opts": ["يَزْرَعُ", "تَزْرَعُ", "أَزْرَعُ", "نَزْرَعُ"], "a": 0}, {"n": 37, "q": "الطَّالِبَاتُ ______ فِي الْمَكْتَبَةِ.", "opts": ["يَقْرَأُونَ", "تَقْرَأُ", "يَقْرَأْنَ", "أَقْرَأُ"], "a": 2}, {"n": 38, "q": "الْمُسْلِمُ ______ الصَّلَاةَ.", "opts": ["يُصَلِّي", "تُصَلِّي", "أُصَلِّي", "نُصَلِّي"], "a": 0}, {"n": 39, "q": "أَنْتُمْ ______ إِلَى الْمُعَلِّمِ.", "opts": ["يَسْمَعُونَ", "تَسْمَعُونَ", "أَسْمَعُ", "نَسْمَعُ"], "a": 1}, {"n": 40, "q": "الطَّبِيبُ يَعْمَلُ فِي ______.", "opts": ["الْمَطَارِ", "الْمُسْتَشْفَى", "الْمَزْرَعَةِ", "الْمَلْعَبِ"], "a": 1}, {"n": 41, "q": "أَيْنَ ذَهَبَ أَحْمَدُ؟", "opts": ["إِلَى الْمَدْرَسَةِ", "إِلَى الشَّاطِئِ", "إِلَى السُّوقِ", "إِلَى الْمَسْجِدِ"], "a": 1}, {"n": 42, "q": "مَتَى ذَهَبَ أَحْمَدُ؟", "opts": ["يَوْمَ الْأَحَدِ", "يَوْمَ الِاثْنَيْنِ", "يَوْمَ الْجُمُعَةِ", "يَوْمَ الثُّلَاثَاءِ"], "a": 2}, {"n": 43, "q": "مَعَ مَنْ ذَهَبَ أَحْمَدُ؟", "opts": ["مَعَ أَصْدِقَائِهِ", "مَعَ أُسْرَتِهِ", "مَعَ مُعَلِّمِهِ", "مَعَ جِيرَانِهِ"], "a": 1}, {"n": 44, "q": "مَاذَا فَعَلَ أَحْمَدُ؟", "opts": ["لَعِبَ بِالرَّمْلِ", "قَرَأَ الْكِتَابَ", "كَتَبَ الدَّرْسَ", "طَبَخَ الطَّعَامَ"], "a": 0}, {"n": 45, "q": "مَاذَا فَعَلَ أَخُوهُ؟", "opts": ["جَلَسَ", "نَامَ", "سَبَحَ فِي الْبَحْرِ", "رَجَعَ إِلَى الْبَيْتِ"], "a": 2}, {"n": 46, "q": "Apakah maksud ayat الْجَوُّ حَارٌّ?", "opts": ["Cuaca sejuk.", "Cuaca panas.", "Cuaca hujan.", "Cuaca mendung."], "a": 1}, {"n": 47, "q": "Pilih terjemahan yang betul bagi ayat أَبِي يَعْمَلُ فِي الْمَكْتَبِ.", "opts": ["Ayah saya bekerja di pejabat.", "Ayah saya belajar di sekolah.", "Ayah saya bermain di padang.", "Ayah saya tidur di rumah."], "a": 0}, {"n": 48, "q": "Pilih ayat yang betul.", "opts": ["الْبِنْتُ جَمِيلٌ", "الْبِنْتُ جَمِيلَةٌ", "الْوَلَدُ جَمِيلَةٌ", "الطَّالِبَةُ مُجْتَهِدٌ"], "a": 1}, {"n": 49, "q": "Apakah maksud ayat نَحْنُ نُحِبُّ وَالِدَيْنَا?", "opts": ["Kami menghormati guru kami.", "Kami menyayangi kedua-dua ibu bapa kami.", "Kami membantu jiran kami.", "Kami menyayangi kawan kami."], "a": 1}, {"n": 50, "q": "Pilih ayat yang bermaksud \"Saya pergi ke masjid untuk menunaikan solat.\"", "opts": ["أَذْهَبُ إِلَى الْمَسْجِدِ لِأُصَلِّيَ", "أَذْهَبُ إِلَى السُّوقِ لِأَشْتَرِيَ", "أَذْهَبُ إِلَى الْمَدْرَسَةِ لِأَدْرُسَ", "أَذْهَبُ إِلَى الْمَطْعَمِ لِآكُلَ"], "a": 0}];
const sections={1:"Bahagian A: Kosa Kata (1–15)",16:"Bahagian B: Tatabahasa (16–30)",31:"Bahagian C: Lengkapkan Ayat (31–40)",41:"Bahagian D: Kefahaman (41–50)"};
const quiz=document.getElementById('quiz');
questions.forEach(q=>{
 if(sections[q.n]){const h=document.createElement('h2');h.className='section';h.textContent=sections[q.n];quiz.appendChild(h);}
 if(q.n===41){const p=document.createElement('div');p.className='passage';p.innerHTML='<strong>Baca petikan berikut: <span class="arabic">رِحْلَةٌ إِلَى الشَّاطِئِ</span></strong><p class="arabic">ذَهَبَ أَحْمَدُ مَعَ أُسْرَتِهِ إِلَى الشَّاطِئِ يَوْمَ الْجُمُعَةِ. وَصَلُوا فِي السَّاعَةِ التَّاسِعَةِ صَبَاحًا. لَعِبَ أَحْمَدُ بِالرَّمْلِ، وَسَبَحَ أَخُوهُ فِي الْبَحْرِ. أَعَدَّتِ الْأُمُّ الطَّعَامَ لِلْأُسْرَةِ. كَانَ الْجَمِيعُ سَعِيدِينَ جِدًّا.</p><p><em>Terjemahan:</em> Ahmad pergi bersama keluarganya ke pantai pada hari Jumaat. Mereka tiba pada pukul sembilan pagi. Ahmad bermain pasir, manakala abangnya berenang di laut. Ibu menyediakan makanan untuk keluarga. Semua orang sangat gembira.</p>';quiz.appendChild(p);}
 const card=document.createElement('section');card.className='question';card.id='q'+q.n;
 const qt=document.createElement('div');qt.className='qtext';qt.innerHTML=q.n+'. '+q.q.replace(/[\u0600-\u06FF]/g,m=>m);card.appendChild(qt);
 const opts=document.createElement('div');opts.className='options';
 q.opts.forEach((o,i)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+q.n;input.value=i;input.addEventListener('change',updateProgress);const span=document.createElement('span');span.innerHTML=String.fromCharCode(65+i)+'. '+(o.match(/[\u0600-\u06FF]/)?'<span class="arabic">'+o+'</span>':o);label.append(input,span);opts.appendChild(label);});
 card.appendChild(opts);const fb=document.createElement('div');fb.className='feedback';fb.id='fb'+q.n;card.appendChild(fb);quiz.appendChild(card);
});
function updateProgress(){let count=questions.filter(q=>document.querySelector('input[name="q'+q.n+'"]:checked')).length;document.getElementById('progress').textContent=count+' / 50 dijawab';}
function gradeQuiz(){let score=0;questions.forEach(q=>{const card=document.getElementById('q'+q.n),chosen=document.querySelector('input[name="q'+q.n+'"]:checked'),labels=card.querySelectorAll('.option'),fb=document.getElementById('fb'+q.n);labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(i===q.a)l.classList.add('correct');});if(chosen){if(+chosen.value===q.a)score++;else labels[+chosen.value].classList.add('wrong');}fb.textContent=chosen?(+chosen.value===q.a?'Betul!':'Jawapan betul: '+String.fromCharCode(65+q.a)):'Belum dijawab. Jawapan: '+String.fromCharCode(65+q.a);});document.getElementById('result').textContent='Markah: '+score+' / 50 ('+Math.round(score/50*100)+'%)';window.scrollTo({top:0,behavior:'smooth'});}
function resetQuiz(){document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);document.querySelectorAll('.option').forEach(x=>x.classList.remove('correct','wrong'));document.querySelectorAll('.feedback').forEach(x=>x.textContent='');document.getElementById('result').textContent='Pilih jawapan bagi setiap soalan.';updateProgress();window.scrollTo({top:0,behavior:'smooth'});}
</script></body></html>
